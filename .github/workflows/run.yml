name: KP Solar Fetcher & Dashboard Auto Deploy

on:
  schedule:
    - cron: '0 * * * *' # 毎時0分に自動実行
  workflow_dispatch:

# GitHub Pages へのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行の制御
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  run-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dash-x9k2m7p4q/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager python-dotenv pandas requests beautifulsoup4

      - name: Install Rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_ONEDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [onedrive]
          type = onedrive
          token = $RCLONE_TOKEN
          drive_type = personal
          drive_id = me
          EOF

      - name: Set Current Year Environment Variable
        run: |
          YEAR=$(date +%Y)
          echo "TARGET_FILE=パワコン_${YEAR}.csv" >> $GITHUB_ENV
          echo "AMEDAS_FILE=アメダス_${YEAR}.csv" >> $GITHUB_ENV
          echo "今年の対象パワコンファイル名: パワコン_${YEAR}.csv"
          echo "今年の対象アメダスファイル名: アメダス_${YEAR}.csv"

      - name: Download Master CSVs from OneDrive
        run: |
          echo "=== 古いローカルCSVの削除 ==="
          rm -f ./${TARGET_FILE} ./${AMEDAS_FILE}
          
          echo "=== OneDriveから ${TARGET_FILE} および ${AMEDAS_FILE} を強制ダウンロード開始 ==="
          rclone copy "onedrive:ドキュメント/${TARGET_FILE}" ./ -v || true
          rclone copy "onedrive:ドキュメント/${AMEDAS_FILE}" ./ -v || true
          
          echo "=== ダウンロード後のローカルファイル確認 ==="
          ls -la ${TARGET_FILE} || echo "※パワコンCSVが存在しません（新規作成されます）"
          ls -la ${AMEDAS_FILE} || echo "※アメダスCSVが存在しません（新規作成されます）"

      - name: Run Solar Fetcher & CSV Update
        env:
          KP_USER_ID: ${{ secrets.KP_USER_ID }}
          KP_PASSWORD: ${{ secrets.KP_PASSWORD }}
          CSV_FILENAME: ${{ env.TARGET_FILE }}
        run: python kp_solar_fetcher.py

      - name: Run Amedas Fetcher & CSV Update
        env:
          AMEDAS_FILENAME: ${{ env.AMEDAS_FILE }}
        run: python amedas_fetcher.py

      - name: Upload updated CSVs to OneDrive
        run: |
          echo "=== 更新された ${TARGET_FILE} および ${AMEDAS_FILE} をOneDriveへアップロード開始 ==="
          rclone copy ./${TARGET_FILE} "onedrive:ドキュメント/" -v
          rclone copy ./${AMEDAS_FILE} "onedrive:ドキュメント/" -v

      # --- ここから Webダッシュボード生成 ＆ デプロイ処理 ---

      - name: Generate HTML Dashboard
        env:
          CSV_FILENAME: ${{ env.TARGET_FILE }}
          AMEDAS_FILENAME: ${{ env.AMEDAS_FILE }}
        run: |
          python generate_html.py

      - name: Prepare Web Root (推測不能URLフォルダの構築)
        run: |
          # 公開用ディレクトリ _site を作成
          mkdir -p _site/dash-x9k2m7p4q
          
          # 生成された index.html を推測不能フォルダに移動
          mv index.html _site/dash-x9k2m7p4q/
          
          # 検索エンジンインデックス拒否設定 (robots.txt)
          echo -e "User-agent: *\nDisallow: /" > _site/robots.txt
          
          # ルートアクセス時の空ページ（または404対策）
          echo "<html><body><h1>404 Not Found</h1></body></html>" > _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
