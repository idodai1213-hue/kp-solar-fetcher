name: KP Solar Fetcher & OneDrive Sync Cron

on:
  schedule:
    # 毎時0分（JST毎時9分頃）に自動実行
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager python-dotenv pandas openpyxl

      - name: Install Rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_ONEDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [onedrive]
          type = onedrive
          token = $RCLONE_TOKEN
          drive_type = personal
          drive_id = me
          EOF

      - name: Download Excel from OneDrive
        run: |
          # OneDriveの ドキュメント フォルダからExcelを取得
          rclone copy "onedrive:ドキュメント/太陽光発電システム_2026年.xlsx" ./ --ignore-checksum || true

      - name: Run Solar Fetcher & Excel Update
        env:
          KP_USER_ID: ${{ secrets.KP_USER_ID }}
          KP_PASSWORD: ${{ secrets.KP_PASSWORD }}
        run: python kp_solar_fetcher.py

      - name: Upload updated Excel to OneDrive
        run: |
          # 更新されたExcelをOneDriveの ドキュメント フォルダへ上書きアップロード
          rclone copy ./太陽光発電システム_2026年.xlsx "onedrive:ドキュメント/"
