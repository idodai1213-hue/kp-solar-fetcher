name: KP-NET Solar Data Auto Fetcher

on:
  schedule:
    # 毎日夜間・早朝等に定期実行（例: 毎日 UTC 19:00 = JST 04:00）
    - cron: '0 19 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium webdriver-manager

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Setup rclone config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" > ~/.config/rclone/rclone.conf

      - name: Download Master CSV from OneDrive
        run: |
          echo "=== 古いローカルCSVの削除 ==="
          rm -f ./パワコン_2026.csv
          
          echo "=== OneDriveからパワコン_2026.csvをダウンロード開始 ==="
          rclone copy "onedrive:ドキュメント/パワコン_2026.csv" ./ -v || rclone copy "onedrive:Documents/パワコン_2026.csv" ./ -v || true
          
          echo "=== ダウンロード後のローカルファイル確認 ==="
          ls -la パワコン_2026.csv || echo "※初回の動作またはファイルが存在しません（新規作成されます）"

      - name: Run Solar Fetcher & CSV Update
        env:
          KP_USER_ID: ${{ secrets.KP_USER_ID }}
          KP_PASSWORD: ${{ secrets.KP_PASSWORD }}
        run: |
          python kp_solar_fetcher.py

      - name: Upload updated CSV to OneDrive
        run: |
          echo "=== 更新されたパワコン_2026.csvをOneDriveへアップロード開始 ==="
          rclone copy ./パワコン_2026.csv "onedrive:ドキュメント/" -v
          rclone copy ./パワコン_2026.csv "onedrive:Documents/" -v
