name: KP Solar Fetcher & OneDrive Sync Cron

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager python-dotenv pandas

      - name: Install Rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_ONEDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [onedrive]
          type = onedrive
          token = $RCLONE_TOKEN
          drive_type = personal
          drive_id = me
          EOF

      - name: Download Master CSV from OneDrive
        run: |
          echo "=== 古いローカルCSVの削除 ==="
          rm -f ./パワコン_2026.csv
          
          echo "=== OneDriveからCSVを強制ダウンロード開始 ==="
          rclone copy "onedrive:ドキュメント/パワコン_2026.csv" ./ -v || true
          
          echo "=== ダウンロード後のローカルファイル確認 ==="
          ls -la パワコン_2026.csv || echo "※初回の動作またはファイルが存在しません（新規作成されます）"

      - name: Run Solar Fetcher & CSV Update
        env:
          KP_USER_ID: ${{ secrets.KP_USER_ID }}
          KP_PASSWORD: ${{ secrets.KP_PASSWORD }}
        run: python kp_solar_fetcher.py

      - name: Upload updated CSV to OneDrive
        run: |
          echo "=== 更新されたCSVをOneDriveへアップロード開始 ==="
          rclone copy ./パワコン_2026.csv "onedrive:Documents/" -v
