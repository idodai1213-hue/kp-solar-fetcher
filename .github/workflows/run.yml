name: KP Solar Fetcher Cron

on:
  schedule:
    # 毎時0分（UTC基準で毎時0分 ＝ 日本時間の毎時9分頃）に自動実行
    - cron: '0 * * * *'
  # 手動でテスト実行するためのボタンを画面上に表示する設定
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコードを取得
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Python環境のセットアップ
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 必要なライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager python-dotenv

      # 4. スクリプトの実行（SecretsからID・パスワードを読み込み）
      - name: Run Solar Fetcher
        env:
          KP_USER_ID: ${{ secrets.KP_USER_ID }}
          KP_PASSWORD: ${{ secrets.KP_PASSWORD }}
        run: python kp_solar_fetcher.py
