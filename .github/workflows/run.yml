name: KP Solar Fetcher & OneDrive Sync Cron

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager python-dotenv pandas openpyxl

      - name: Install Rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_ONEDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [onedrive]
          type = onedrive
          token = $RCLONE_TOKEN
          drive_type = personal
          drive_id = me
          EOF

      - name: Download Excel from OneDrive
        run: |
          echo "=== OneDriveからExcelをダウンロード開始 ==="
          rclone copy "onedrive:ドキュメント/太陽光発電システム_2026年.xlsx" ./ -v
          echo "=== ダウンロード後のローカルファイル確認 ==="
          ls -la

      - name: Run Solar Fetcher & Excel Update
        env:
          KP_USER_ID: ${{ secrets.KP_USER_ID }}
          KP_PASSWORD: ${{ secrets.KP_PASSWORD }}
        run: python kp_solar_fetcher.py

      - name: Upload updated Excel to OneDrive
        run: |
          echo "=== 更新されたExcelをOneDriveへアップロード開始 ==="
          rclone copy ./太陽光発電システム_2026年.xlsx "onedrive:ドキュメント/" -v
